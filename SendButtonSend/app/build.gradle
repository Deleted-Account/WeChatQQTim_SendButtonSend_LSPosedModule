plugins {
    id 'com.android.application'
}

android {
    namespace 'com.anonymous.sendbuttonsend'
    compileSdk 37
    // AGP 9 默认启用内建 Kotlin，纯 Java 模块会被塞入 kotlin-stdlib（APK 从 15KB 涨到 878KB）
    enableKotlin = false

    defaultConfig {
        applicationId "com.anonymous.sendbuttonsend"
        minSdk 26
        targetSdk 34
        versionCode 4
        versionName "1.4"
    }

    signingConfigs {
        // 用 debug keystore 签 release：签名与 debug 包一致，可直接 adb install -r 覆盖升级。
        // 个人自用模块，不涉及应用市场上架，无需单独维护 release keystore。
        release {
            storeFile file(System.getProperty("user.home") + "/.android/debug.keystore")
            storePassword "android"
            keyAlias "androiddebugkey"
            keyPassword "android"
        }
    }

    buildTypes {
        release {
            // 不开混淆：本模块仅一个入口类，R8 收益只有几 KB，
            // 反而要配 keep 规则防止 Xposed 框架按 java_init.list 反射加载入口类时类名被改。
            minifyEnabled false
            signingConfig signingConfigs.release
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    compileOnly 'io.github.libxposed:api:102.0.0'
}
